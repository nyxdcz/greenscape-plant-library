        shell: bash
        run: |
          grep -F 'id="sunlightFilter"' assets/js/app.js
          grep -F 'id="librarySort"' assets/js/app.js
          grep -F 'data-action="library-view"' assets/js/app.js
          grep -F 'class="plant-code-badge"' assets/js/app.js
          grep -F "const collectionClass = isList ? 'plant-list-view' : 'plant-grid';" assets/js/app.js
          ! grep -F 'class="library-quick-filters"' assets/js/app.js
          ! grep -F 'id="resultCount"' assets/js/app.js

      - name: Run website quality checks
        run: npm run quality

      - name: Check formatting
        run: git diff --check

      - name: Commit Plant Library reference layout
        shell: bash
        run: |
          if git diff --quiet -- assets/js/app.js assets/js/maintenance.js assets/css/plant-library-refinements.css index.html README.md; then
            echo "The approved Plant Library reference layout is already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/app.js assets/js/maintenance.js assets/css/plant-library-refinements.css index.html README.md
            git commit -m "feat: refine Plant Library controls and cards"
            git push origin HEAD:main
          fi

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp favicon.ico _site/
          cp favicon.svg _site/
          cp site.webmanifest _site/
          cp robots.txt _site/
          cp .nojekyll _site/
          cp -R assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
          include-hidden-files: true
          retention-days: 7

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
