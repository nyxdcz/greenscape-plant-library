name: Apply Plant Library Reference Layout V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-plant-library-reference-layout-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Update and deploy Plant Library
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

