name: Apply Sidebar and Plant-Code Refinements Fixed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-sidebar-code-refinements-fixed.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Refine sidebar, Greenie, and plant codes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

