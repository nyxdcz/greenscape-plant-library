      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check assets/js/app.js
          node --check assets/js/sidebar-assistant.js

      - name: Verify approved UI state
        shell: bash
        run: |
          grep -F 'Beta — Work in Progress' index.html
          grep -F 'Report an issue or send a suggestion' index.html
          grep -F "dashboard: 'Dashboard'" assets/js/app.js
          grep -F "library: 'Plant Library'" assets/js/app.js
          grep -F 'pageTitle.textContent = currentTitle;' assets/js/app.js
          grep -F 'class="plant-code-body"' assets/js/app.js
          ! grep -F 'class="plant-code-badge"' assets/js/app.js
          grep -F 'const FLOATING_Z_INDEX = 2147483000;' assets/js/sidebar-assistant.js
          grep -F 'document.body.appendChild(card);' assets/js/sidebar-assistant.js
          grep -F 'parent.insertBefore(plantCode, commonName);' assets/js/sidebar-assistant.js
          grep -F 'GREENSCAPE_SIDEBAR_CHROME_CLEANUP_V1_START' assets/css/styles.css
          grep -F 'GREENSCAPE_PLANT_CODE_BODY_V1_START' assets/css/plant-library-refinements.css
          grep -F '20260729-sidebar-code-cleanup2' index.html

      - name: Run website quality checks
        run: npm run quality

      - name: Check formatting
        run: git diff --check

      - name: Commit refinements
        shell: bash
        run: |
          if git diff --quiet -- assets/js/app.js assets/js/sidebar-assistant.js assets/css/styles.css assets/css/sidebar-assistant.css assets/css/plant-library-refinements.css index.html README.md; then
            echo "The approved refinements are already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/app.js assets/js/sidebar-assistant.js assets/css/styles.css assets/css/sidebar-assistant.css assets/css/plant-library-refinements.css index.html README.md
            git commit -m "refactor: refine sidebar and plant codes"
            git push origin HEAD:main
          fi

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp favicon.ico _site/
          cp favicon.svg _site/
          cp site.webmanifest _site/
          cp robots.txt _site/
          cp .nojekyll _site/
          cp -R assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
          include-hidden-files: true
          retention-days: 7

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
