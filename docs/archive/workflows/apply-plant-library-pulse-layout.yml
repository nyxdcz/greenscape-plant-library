name: Apply Plant Library Pulse Layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-plant-library-pulse-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-plant-library:
    name: Build Plant Library Pulse layout
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply approved Plant Library update
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/apply-plant-library-pulse.py
          python3 /tmp/apply-plant-library-pulse.py

      - name: Check JavaScript syntax
        run: node --check assets/js/app.js

      - name: Run website quality checks
        run: npm run quality

      - name: Check formatting
        run: git diff --check

      - name: Commit and publish Plant Library Pulse
        shell: bash
        run: |
          if git diff --quiet -- assets/css/plant-library-refinements.css assets/js/app.js index.html README.md; then
            echo "The approved Plant Library Pulse layout is already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/plant-library-refinements.css assets/js/app.js index.html README.md
          git commit -m "feat: add Plant Library Pulse layout"
          git push origin HEAD:main
