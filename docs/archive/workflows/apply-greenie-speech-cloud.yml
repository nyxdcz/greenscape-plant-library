name: Apply Greenie Speech Cloud

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-greenie-speech-cloud.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Update and deploy Greenie speech cloud
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

