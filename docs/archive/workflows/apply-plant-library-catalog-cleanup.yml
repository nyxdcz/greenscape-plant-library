      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/maintenance.js

      - name: Verify approved catalogue state
        shell: bash
        run: |
          ! grep -F 'class="library-pulse-grid"' assets/js/app.js
          grep -F 'class="button secondary small plant-view-details"' assets/js/app.js
          grep -F "'library-quick-filter'," assets/js/maintenance.js
          grep -F "'clear-library-category'," assets/js/maintenance.js
          grep -F 'border-top: 0 !important;' assets/css/plant-library-refinements.css

      - name: Run website quality checks
        run: npm run quality

      - name: Check formatting
        run: git diff --check

      - name: Commit Plant Library cleanup
        shell: bash
        run: |
          if git diff --quiet -- assets/js/app.js assets/js/maintenance.js assets/css/plant-library-refinements.css index.html README.md; then
            echo "The approved Plant Library catalogue cleanup is already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/app.js assets/js/maintenance.js assets/css/plant-library-refinements.css index.html README.md
            git commit -m "fix: simplify Plant Library catalogue"
            git push origin HEAD:main
          fi

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp favicon.ico _site/
          cp favicon.svg _site/
          cp site.webmanifest _site/
          cp robots.txt _site/
          cp .nojekyll _site/
          cp -R assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
          include-hidden-files: true
          retention-days: 7

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
