          grep -F 'function closeHelpPanel()' assets/js/sidebar-assistant.js
          grep -F 'function showSpeechBox(card)' assets/js/sidebar-assistant.js
          grep -F 'function beginDrag(card, image, origin, startLeft, startTop)' assets/js/sidebar-assistant.js
          grep -F 'if (shouldShowSpeech) showSpeechBox(card);' assets/js/sidebar-assistant.js
          grep -F "speech.addEventListener('click'" assets/js/sidebar-assistant.js
          ! grep -F 'if (shouldOpenHelp) openHelpPanel();' assets/js/sidebar-assistant.js
          grep -F 'margin: 20px 0 0;' assets/css/sidebar-assistant.css
          grep -F '.sidebar-pet-card.is-speech-open .sidebar-pet-speech' assets/css/sidebar-assistant.css
          grep -F '20260729-greenie-speech-first1' index.html

      - name: Run website quality checks
        run: npm run quality

      - name: Check formatting
        run: git diff --check

      - name: Commit Greenie behavior
        shell: bash
        run: |
          if git diff --quiet -- assets/js/sidebar-assistant.js assets/css/sidebar-assistant.css index.html README.md; then
            echo "The Greenie speech-first behavior is already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/sidebar-assistant.js assets/css/sidebar-assistant.css index.html README.md
            git commit -m "fix: make Greenie speech-first help trigger"
            git push origin HEAD:main
          fi

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp favicon.ico _site/
          cp favicon.svg _site/
          cp site.webmanifest _site/
          cp robots.txt _site/
          cp .nojekyll _site/
          cp -R assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
          include-hidden-files: true
          retention-days: 7

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
