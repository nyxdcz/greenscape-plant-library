name: Apply Greenie Speech-First Drag Behavior

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-greenie-speech-first-drag.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Update Greenie speech and drag behavior
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

