name: Apply Plant Library Spacing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-plant-library-spacing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-spacing:
    name: Refine Plant Library spacing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply approved spacing changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path("assets/css/plant-library-refinements.css")
          index_path = Path("index.html")

          css = css_path.read_text(encoding="utf-8")
          index = index_path.read_text(encoding="utf-8")

          replacements = [
              ("  gap: 10px !important;\n  margin: 0 0 16px !important;\n  padding: 10px !important;",
               "  gap: 8px !important;\n  margin: 0 0 14px !important;\n  padding: 8px !important;"),
              ("#plantGrid .plant-grid {\n  align-items: stretch;\n  gap: 14px !important;",
               "#plantGrid .plant-grid {\n  align-items: stretch;\n  gap: 12px !important;"),
              ("    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;\n    gap: 14px !important;",
               "    grid-template-columns: repeat(5, minmax(0, 1fr)) !important;\n    gap: 12px !important;"),
              ("    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;\n    gap: 12px !important;",
               "    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;\n    gap: 10px !important;"),
          ]

          for old, new in replacements:
              if old in css:
                  css = css.replace(old, new, 1)
              elif new not in css:
                  raise SystemExit(f"Expected CSS block not found:\n{old}")

          old_cache = "assets/css/plant-library-refinements.css?v=20260729-library-refinement2"
          new_cache = "assets/css/plant-library-refinements.css?v=20260729-library-refinement3"

          if old_cache in index:
              index = index.replace(old_cache, new_cache, 1)
          elif new_cache not in index:
              raise SystemExit("Plant Library refinement stylesheet cache key was not found.")

          required_checks = [
              "gap: 8px !important;\n  margin: 0 0 14px !important;\n  padding: 8px !important;",
              "#plantGrid .plant-grid {\n  align-items: stretch;\n  gap: 12px !important;",
              "grid-template-columns: repeat(5, minmax(0, 1fr)) !important;\n    gap: 12px !important;",
              "grid-template-columns: repeat(4, minmax(0, 1fr)) !important;\n    gap: 10px !important;",
              "grid-template-columns: repeat(3, minmax(0, 1fr)) !important;\n    gap: 8px !important;",
          ]

          for check in required_checks:
              if check not in css:
                  raise SystemExit(f"Spacing verification failed:\n{check}")

          css_path.write_text(css, encoding="utf-8")
          index_path.write_text(index, encoding="utf-8")
          PY

      - name: Run website quality checks
        run: npm run quality

      - name: Check formatting
        run: git diff --check

      - name: Commit and publish spacing update
        shell: bash
        run: |
          if git diff --quiet -- assets/css/plant-library-refinements.css index.html; then
            echo "Approved spacing is already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/plant-library-refinements.css index.html
          git commit -m "fix: refine Plant Library box spacing"
          git push origin HEAD:main
