name: Apply Dashboard Uniform Width

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-dashboard-uniform-width.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard-width:
    name: Match dashboard bento widths
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply approved desktop width
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          styles_path = Path("assets/css/styles.css")
          index_path = Path("index.html")

          styles = styles_path.read_text(encoding="utf-8")
          index = index_path.read_text(encoding="utf-8")

          start_marker = "/* GREENSCAPE_DASHBOARD_UNIFORM_WIDTH_V1_START */"
          end_marker = "/* GREENSCAPE_DASHBOARD_UNIFORM_WIDTH_V1_END */"

          width_block = """
          /* GREENSCAPE_DASHBOARD_UNIFORM_WIDTH_V1_START */
          /* Desktop hero aligns with the full dashboard bento width. */
          @media (min-width: 1181px) {
            #pageContent > .hero {
              width: 100% !important;
              max-width: none !important;
              margin-left: 0 !important;
              margin-right: 0 !important;
            }
          }
          /* GREENSCAPE_DASHBOARD_UNIFORM_WIDTH_V1_END */
          """.strip()

          if start_marker in styles and end_marker in styles:
              before, remainder = styles.split(start_marker, 1)
              _, after = remainder.split(end_marker, 1)
              styles = before.rstrip() + "\n\n" + width_block + after
          else:
              styles = styles.rstrip() + "\n\n" + width_block + "\n"

          old_cache = "assets/css/styles.css?v=20260729-dashboard-bento-spacing1"
          new_cache = "assets/css/styles.css?v=20260729-dashboard-uniform-width1"

          if old_cache in index:
              index = index.replace(old_cache, new_cache, 1)
          elif new_cache not in index:
              raise SystemExit("Main stylesheet cache key was not found in index.html.")

          required = [
              "@media (min-width: 1181px)",
              "#pageContent > .hero {",
              "width: 100% !important;",
              "max-width: none !important;",
              "margin-left: 0 !important;",
              "margin-right: 0 !important;",
          ]

          for check in required:
              if check not in styles:
                  raise SystemExit(f"Dashboard width verification failed:\n{check}")

          styles_path.write_text(styles, encoding="utf-8")
          index_path.write_text(index, encoding="utf-8")
          PY

      - name: Run website quality checks
        run: npm run quality

      - name: Check formatting
        run: git diff --check

      - name: Commit and publish dashboard width
        shell: bash
        run: |
          if git diff --quiet -- assets/css/styles.css index.html; then
            echo "The dashboard already uses the approved uniform width."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/styles.css index.html
          git commit -m "fix: align dashboard bento widths"
          git push origin HEAD:main
