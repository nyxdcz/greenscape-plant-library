          python3 -m py_compile /tmp/repository-quality-pr.py

      - name: Record baseline metrics
        run: python3 /tmp/repository-quality-metrics.py /tmp/before-metrics.json

      - name: Run unchanged pre-change baseline
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -f "%e" -o /tmp/quality-before-seconds.txt npm run quality 2>&1 | tee /tmp/quality-before.log
          git diff --check
          test -z "$(git status --short)"

      - name: Create review branch
        shell: bash
        run: |
          BRANCH="codex/repository-quality-audit-${{ github.run_id }}"
          echo "AUDIT_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: Expand automated quality and security coverage
        shell: bash
        run: |
          python3 /tmp/repository-quality-patch.py quality
          npm run quality
          git diff --check
          git add package.json scripts/check-js.mjs scripts/security-check.mjs scripts/validate.mjs
          git commit -m "test: cover all production JavaScript"

      - name: Reduce observer and CSS overhead
        shell: bash
        run: |
          python3 /tmp/repository-quality-patch.py performance
          npm run quality
          git diff --check
          git add assets/js/sidebar-assistant.js assets/js/magnetic-dock.js assets/css/sidebar-assistant.css assets/css/plant-library-refinements.css index.html
          git commit -m "perf: reduce sidebar and dock observer work"

      - name: Improve dynamic accessibility
        shell: bash
        run: |
          python3 /tmp/repository-quality-patch.py accessibility
          npm run quality
          git diff --check
          git add assets/js/app.js assets/js/magnetic-dock.js scripts/validate.mjs index.html
          git commit -m "fix: improve results and phone menu accessibility"

      - name: Remove stale one-shot workflows
        shell: bash
        run: |
          python3 /tmp/repository-quality-patch.py hygiene
          npm run quality
          git diff --check
          git add -A .github/workflows scripts/validate.mjs
          git commit -m "chore: remove stale one-shot workflows"

      - name: Record post-change metrics
        run: python3 /tmp/repository-quality-metrics.py /tmp/after-metrics.json

      - name: Time post-change quality checks
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -f "%e" -o /tmp/quality-after-seconds.txt npm run quality 2>&1 | tee /tmp/quality-after.log
          git diff --check

      - name: Update documentation
        shell: bash
        run: |
          python3 /tmp/repository-quality-patch.py docs
          npm run quality
          git diff --check
          git add README.md
          git commit -m "docs: document repository quality audit"

      - name: Push review branch
        run: git push --set-upstream origin "$AUDIT_BRANCH"

      - name: Prepare pull request summary
        run: python3 /tmp/repository-quality-pr.py

      - name: Open pull request
        id: open-pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PR_URL="$(gh pr create \
            --base main \
            --head "$AUDIT_BRANCH" \
            --title "Improve repository quality, performance, and accessibility" \
            --body-file /tmp/pull-request-body.md)"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Pull request created: $PR_URL"

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          echo "## Repository quality audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review branch: \`$AUDIT_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.open-pr.outputs.url }}" ]; then
            echo "Pull request: ${{ steps.open-pr.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pull request creation was blocked by repository Actions settings." >> "$GITHUB_STEP_SUMMARY"
            echo "Open a pull request manually from \`$AUDIT_BRANCH\` into \`main\`." >> "$GITHUB_STEP_SUMMARY"
          fi
