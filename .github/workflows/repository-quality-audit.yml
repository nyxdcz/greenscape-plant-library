name: Repository Quality Audit and Pull Request Fixed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-quality-audit.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repository-quality-audit
  cancel-in-progress: false

jobs:
  audit-improve-and-open-pr:
    name: Audit, improve, validate, and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

