name: Plant CSV Sync

on:
  push:
    branches:
      - main
    paths:
      - data/Greenscape_Plant_Library.csv
      - data/ADD_PLANTS_HERE/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plant-csv-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import folder plant files
        run: node scripts/import_plant_additions.mjs

      - name: Convert plant CSV to website data
        run: node scripts/sync_plants_from_csv.mjs

      - name: Prepare thumbnail generator
        run: npm install --prefix "$RUNNER_TEMP/greenscape-thumbnail-tools" --no-package-lock --ignore-scripts sharp@0.35.5

      - name: Generate list thumbnails
        run: node scripts/catalogue-thumbnails.mjs --sharp-module "$RUNNER_TEMP/greenscape-thumbnail-tools/node_modules/sharp/dist/index.cjs"

      - name: Run website checks
        run: npm run quality

      - name: Publish generated plant data
        shell: bash
        run: |
          if git diff --quiet -- data/Greenscape_Plant_Library.csv assets/js/data.js index.html assets/js/catalogue-thumbnails.mjs assets/images/thumbnails && [ -z "$(git ls-files --others --exclude-standard assets/images/thumbnails)" ]; then
            echo "Plant data is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Greenscape_Plant_Library.csv assets/js/data.js index.html assets/js/catalogue-thumbnails.mjs assets/images/thumbnails
          git commit -m "chore: sync plant data from Google Sheets CSV"
          git push origin HEAD:main
