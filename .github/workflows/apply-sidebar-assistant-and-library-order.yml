          GREENSCAPE_SIDEBAR_B64
          base64 --decode /tmp/sidebar-assistant-patch.b64 > /tmp/sidebar-assistant-patch.py
          python3 -m py_compile /tmp/sidebar-assistant-patch.py
          python3 /tmp/sidebar-assistant-patch.py

      - name: Check JavaScript syntax
        run: node --check assets/js/sidebar-assistant.js

      - name: Verify sidebar assistant files
        shell: bash
        run: |
          test -f assets/js/sidebar-assistant.js
          test -f assets/css/sidebar-assistant.css
          test -f assets/images/greenscape-pet.gif
          grep -F 'assets/css/sidebar-assistant.css?v=20260729-sidebar-assistant1' index.html
          grep -F 'assets/js/sidebar-assistant.js?v=20260729-sidebar-assistant1' index.html
          grep -F 'reorderPlantNames' assets/js/sidebar-assistant.js
          grep -F 'sidebar-pet-card' assets/css/sidebar-assistant.css

      - name: Run website quality checks
        run: npm run quality

      - name: Check formatting
        run: git diff --check

      - name: Commit sidebar assistant update
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/js/sidebar-assistant.js assets/css/sidebar-assistant.css assets/images/greenscape-pet.gif README.md; then
            echo "The sidebar assistant update is already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html assets/js/sidebar-assistant.js assets/css/sidebar-assistant.css assets/images/greenscape-pet.gif README.md
            git commit -m "feat: add sidebar assistant and reorder plant names"
            git push origin HEAD:main
          fi

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp favicon.ico _site/
          cp favicon.svg _site/
          cp site.webmanifest _site/
          cp robots.txt _site/
          cp .nojekyll _site/
          cp -R assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
          include-hidden-files: true
          retention-days: 7

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
