      - name: Check JavaScript syntax
        run: node --check assets/js/sidebar-assistant.js

      - name: Verify draggable Greenie state
        shell: bash
        run: |
          test -f assets/images/greenscape-pet.gif
          test -f assets/images/greenscape-pet-drag.gif
          grep -F "const DRAG_GIF = 'assets/images/greenscape-pet-drag.gif';" assets/js/sidebar-assistant.js
          grep -F 'function enableGreenieDragging(card)' assets/js/sidebar-assistant.js
          grep -F 'image.src = DRAG_GIF;' assets/js/sidebar-assistant.js
          grep -F 'speech.addEventListener' assets/js/sidebar-assistant.js
          ! grep -F 'sidebar-settings-panel' assets/js/sidebar-assistant.js
          ! grep -F 'sidebar-utility-button' assets/js/sidebar-assistant.js
          ! grep -F 'sidebar-pet-close' assets/js/sidebar-assistant.js
          grep -F '20260729-greenie-drag1' index.html

      - name: Run website quality checks
        run: npm run quality

      - name: Check formatting
        run: git diff --check

      - name: Commit draggable Greenie update
        shell: bash
        run: |
          if git diff --quiet -- assets/js/sidebar-assistant.js assets/css/sidebar-assistant.css assets/images/greenscape-pet-drag.gif index.html README.md; then
            echo "The draggable Greenie update is already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/sidebar-assistant.js assets/css/sidebar-assistant.css assets/images/greenscape-pet-drag.gif index.html README.md
            git commit -m "feat: make Greenie draggable"
            git push origin HEAD:main
          fi

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp favicon.ico _site/
          cp favicon.svg _site/
          cp site.webmanifest _site/
          cp robots.txt _site/
          cp .nojekyll _site/
          cp -R assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
          include-hidden-files: true
          retention-days: 7

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
