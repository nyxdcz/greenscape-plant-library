name: Apply Draggable Greenie Assistant

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-draggable-greenie-assistant.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Update and deploy draggable Greenie
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
