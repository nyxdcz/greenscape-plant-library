name: Apply Plant Library Glass Toolbar and Titles

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-plant-library-glass-toolbar.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Update and deploy Plant Library
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
