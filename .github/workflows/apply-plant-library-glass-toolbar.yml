      - name: Check JavaScript syntax
        run: node --check assets/js/app.js

      - name: Verify approved title and toolbar state
        shell: bash
        run: |
          grep -F '<h2 class="plant-common-name">${escapeHTML(plantName)}</h2>' assets/js/app.js
          ! grep -F 'plant-title-link' assets/js/app.js
          grep -F 'backdrop-filter: blur(18px) saturate(145%);' assets/css/plant-library-refinements.css
          grep -F 'pointer-events: none !important;' assets/css/plant-library-refinements.css
          grep -F '20260729-library-glass-titles1' index.html

      - name: Run website quality checks
        run: npm run quality

      - name: Check formatting
        run: git diff --check

      - name: Commit Plant Library glass toolbar
        shell: bash
        run: |
          if git diff --quiet -- assets/js/app.js assets/css/plant-library-refinements.css index.html README.md; then
            echo "The approved Plant Library glass toolbar and plain titles are already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/js/app.js assets/css/plant-library-refinements.css index.html README.md
            git commit -m "fix: restore Plant Library glass toolbar"
            git push origin HEAD:main
          fi

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp favicon.ico _site/
          cp favicon.svg _site/
          cp site.webmanifest _site/
          cp robots.txt _site/
          cp .nojekyll _site/
          cp -R assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
          include-hidden-files: true
          retention-days: 7

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
