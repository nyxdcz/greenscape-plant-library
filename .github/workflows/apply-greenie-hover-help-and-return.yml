name: Apply Greenie Hover Help and Return

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-greenie-hover-help-and-return.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Update and deploy Greenie interaction
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
