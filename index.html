  <script>
    history.replaceState(null, "", "#library");
    function greenscapeLibraryOnly() {
      var shell = document.querySelector(".app-shell");
      if (shell) shell.removeAttribute("inert");
      document.body.classList.remove("maintenance-startup-open");
      var overlay = document.getElementById("maintenanceStartup");
      if (overlay) overlay.hidden = true;
      document.querySelectorAll(".nav-item").forEach(function (button) {
        if (button.getAttribute("data-view") !== "library") button.remove();
      });
    }
    document.addEventListener("DOMContentLoaded", greenscapeLibraryOnly);
    window.addEventListener("load", function () {
      greenscapeLibraryOnly();
      setTimeout(greenscapeLibraryOnly, 60);
      setTimeout(greenscapeLibraryOnly, 500);
    });
  </script>
