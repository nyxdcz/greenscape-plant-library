<!doctype html>
<html lang="en" data-app="catalogue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4632">
  <meta name="description" content="Greenscape's plant catalogue for finding botanical names, viewing plant photographs and sizes, and saving plant additions and edits on your device.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="canonical" href="https://nyxdcz.github.io/greenscape-plant-library/">
  <title>Greenscape Plant Library</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/catalogue.css?v=interface-first-pass1">
</head>
<body>
  <header class="library-header">
    <div class="wrap">
      <div class="title-row">
        <h1>Plant Library</h1>
        <button type="button" class="add" id="add" aria-label="Add plant" disabled>+</button>
      </div>
      <label class="field" for="search">
        <span class="sr-only">Search plants</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="search" class="search" type="search" placeholder="Search by name" autocomplete="off" disabled>
      </label>
      <label class="sr-only" for="category">Category</label>
      <select id="category" disabled><option value="All">All categories</option></select>
    </div>
  </header>
  <main class="wrap">
    <div id="storage-notice" class="notice" role="status" hidden></div>
    <p id="count" class="count" aria-live="polite" aria-atomic="true">Loading catalogue</p>
    <div id="list" aria-busy="true">
      <div class="empty" role="status"><p>Loading the plant catalogue...</p><p class="hint">Plant records will appear here when they are ready.</p></div>
    </div>
    <noscript><p class="notice">Turn on JavaScript to search, view, and edit the plant catalogue.</p></noscript>
  </main>
  <dialog id="sheet" class="sheet" aria-labelledby="plant-title"></dialog>
  <script id="catalogue-app" type="module" src="assets/js/catalogue.mjs?v=interface-first-pass1" data-catalogue-src="assets/js/data.js?v=csv-dc6dec84698e-catalogue-sync1" defer></script>
</body>
</html>
